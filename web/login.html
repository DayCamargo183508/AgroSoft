<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root{
      --bg:#0f172a;
      --card:#111827;
      --muted:#94a3b8;
      --text:#e5e7eb;
      --border:#253047;
      --primary:#3b82f6;
      --primary-hover:#2563eb;
      --danger:#ef4444;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, rgba(59,130,246,.25), transparent 60%),
                  radial-gradient(900px 500px at 80% 90%, rgba(168,85,247,.20), transparent 55%),
                  var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .wrap{
      width: 100%;
      max-width: 420px;
    }
    .card{
      background: rgba(17,24,39,.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      backdrop-filter: blur(6px);
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom: 18px;
    }
    .logo{
      width:44px;height:44px;border-radius:14px;
      background: linear-gradient(135deg, rgba(59,130,246,.95), rgba(168,85,247,.9));
      display:grid;place-items:center;
      font-weight:800;
      letter-spacing:.5px;
    }
    h1{
      font-size: 20px;
      margin:0;
      line-height:1.1;
    }
    .subtitle{
      margin:4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    form{margin-top: 14px}
    label{
      display:block;
      font-size: 13px;
      margin: 14px 0 6px;
      color: var(--text);
    }
    .field{
      position:relative;
    }
    input{
      width:100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(2,6,23,.35);
      color: var(--text);
      padding: 12px 12px;
      outline: none;
      font-size: 14px;
    }
    input:focus{
      border-color: rgba(59,130,246,.7);
      box-shadow: 0 0 0 3px rgba(59,130,246,.18);
    }
    .toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform: translateY(-50%);
      border:0;
      background: transparent;
      color: var(--muted);
      cursor:pointer;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 12px;
    }
    .toggle:hover{ color: var(--text); background: rgba(148,163,184,.10); }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top: 12px;
      gap: 12px;
    }
    .remember{
      display:flex;
      align-items:center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      user-select:none;
    }
    .remember input{ width: 16px; height:16px; margin:0; }
    .link{
      color: var(--primary);
      text-decoration:none;
      font-size: 13px;
    }
    .link:hover{ text-decoration: underline; }
    .btn{
      width:100%;
      margin-top: 16px;
      border:0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      padding: 12px 14px;
      font-weight: 700;
      cursor:pointer;
      font-size: 14px;
    }
    .btn:hover{ background: var(--primary-hover); }
    .divider{
      display:flex;
      align-items:center;
      gap: 10px;
      margin: 16px 0 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before,.divider::after{
      content:"";
      height:1px;
      flex:1;
      background: rgba(148,163,184,.18);
    }
    .ghost{
      width:100%;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,.22);
      background: transparent;
      color: var(--text);
      padding: 12px 14px;
      cursor:pointer;
      font-weight: 650;
      font-size: 14px;
    }
    .ghost:hover{ background: rgba(148,163,184,.08); }
    .error{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,.35);
      background: rgba(239,68,68,.10);
      color: #fecaca;
      font-size: 13px;
      display:none;
    }
    .footer{
      margin-top: 14px;
      text-align:center;
      color: var(--muted);
      font-size: 13px;
    }
    .footer a{ color: var(--primary); text-decoration:none; }
    .footer a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="logo">UP</div>
        <div>
          <h1>Iniciar sesión</h1>
          <p class="subtitle">Accede con tu correo y contraseña</p>
        </div>
      </div>

      <form id="loginForm" novalidate>
        <label for="email">Correo</label>
        <div class="field">
          <input id="email" name="email" type="email" placeholder="correo@ejemplo.com" required />
        </div>

        <label for="password">Contraseña</label>
        <div class="field">
          <input id="password" name="password" type="password" placeholder="••••••••" minlength="6" required />
          <button class="toggle" type="button" id="togglePass">Mostrar</button>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" />
            Recordarme
          </label>
          <a class="link" href="#" onclick="alert('Aquí iría tu página de recuperar contraseña'); return false;">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="error" id="errorBox"></div>

        <button class="btn" type="submit">Entrar</button>

        <div class="divider">o</div>
        <button class="ghost" type="button" onclick="alert('Aquí integrarías Google/Microsoft login');">
          Continuar con Google/Microsoft
        </button>

        <div class="footer">
          ¿No tienes cuenta? <a href="#" onclick="alert('Aquí iría tu registro'); return false;">Crear cuenta</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");
    const togglePass = document.getElementById("togglePass");
    const passInput = document.getElementById("password");

    togglePass.addEventListener("click", () => {
      const isHidden = passInput.type === "password";
      passInput.type = isHidden ? "text" : "password";
      togglePass.textContent = isHidden ? "Ocultar" : "Mostrar";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      errorBox.textContent = "";

      const email = form.email.value.trim();
      const password = form.password.value;

      // Validación básica (front-end)
      if (!email || !password) {
        showError("Completa correo y contraseña.");
        return;
      }
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        showError("El correo no tiene un formato válido.");
        return;
      }
      if (password.length < 6) {
        showError("La contraseña debe tener al menos 6 caracteres.");
        return;
      }

      // Aquí conectarías tu backend (fetch/axios). Por ahora simulamos:
      alert("Login OK (simulado). Aquí harías tu petición al servidor.");
      form.reset();
      togglePass.textContent = "Mostrar";
      passInput.type = "password";
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }
  </script>
</body>
</html>
